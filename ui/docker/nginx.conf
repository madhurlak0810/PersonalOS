# Served by the `ui` image (ui/Dockerfile). @API_ORIGIN@ is filled in at build.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src @API_ORIGIN@; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location / {
        try_files $uri /index.html;
    }
}
