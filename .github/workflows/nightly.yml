name: Nightly

# The adversarial and whole-workflow suites against main every night, so a
# dependency that moved underneath us (LangGraph, Pydantic, SQLAlchemy) fails
# here before it fails in someone's pull request. Same Postgres as ci.yml.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  adversarial-and-scenarios:
    name: Adversarial and scenario suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: personalos
          POSTGRES_PASSWORD: personalos
          POSTGRES_DB: personalos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personalos:personalos@localhost:5432/personalos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # Unpinned on purpose: the point of a nightly run is to see the
        # versions a fresh install would get today.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Adversarial tests
        run: pytest tests/adversarial -v
      - name: Graph scenarios, recovery and duplicate side-effect rate
        run: pytest tests/graph_scenarios -v
