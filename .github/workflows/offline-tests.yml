name: Offline tests

# Every pushed commit, on every branch: the node contract gate, the contract
# tests and every pure-logic unit test, with no database and no network. The
# Postgres-backed suite in ci.yml runs on pull requests and on main.
on:
  push:

jobs:
  offline:
    name: Contracts and pure logic (offline)
    runs-on: ubuntu-latest
    # No DATABASE_URL on purpose: the tests that need Postgres skip without it.
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Node contract gate
        run: pytest tests/contracts/test_node_contract_coverage.py -v
      - name: Unit, contract and graph tests
        run: pytest tests -q
