name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  boundaries:
    # Runs first and without installing anything: the check parses source with
    # ast, so a bad dependency fails in seconds instead of after a full install.
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check layer boundaries
        run: python scripts/check_boundaries.py
      - name: Check the implementation guide's project tree
        # Every directory two levels down is in IMPLEMENTATION_GUIDE.md's
        # tree, everything the tree names exists, and "planned" is honest.
        run: python scripts/check_guide_tree.py

  quickstart:
    # The guide's local quick start, run verbatim against the fake job board:
    # migrate, ingest the sample resume, create the sample profile, start the
    # API and worker, reach the approval interrupt and approve it. Its own job
    # and database, because the walkthrough needs a fresh one and the
    # migration tests in `tests` downgrade theirs.
    name: Quick start smoke test
    runs-on: ubuntu-latest
    needs: boundaries
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: personalos
          POSTGRES_PASSWORD: personalos
          POSTGRES_DB: personalos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personalos:personalos@127.0.0.1:5432/personalos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Run the quick start
        run: python scripts/smoke_quickstart.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: boundaries
    services:
      postgres:
        # pgvector/pgvector ships the `vector` extension the pgvector
        # migration (202609150001) needs, which the stock postgres image
        # doesn't have.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: personalos
          POSTGRES_PASSWORD: personalos
          POSTGRES_DB: personalos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personalos:personalos@localhost:5432/personalos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Boundary tests
        run: pytest tests/architecture -v
      - name: Node contract gate
        # Fails if a node registered in any graph has no typed contract in
        # personalos.graphs.contracts or no @covers_node contract test.
        run: pytest tests/contracts/test_node_contract_coverage.py -v
      - name: Action policy gate
        # Fails if an ActionKind has no row in personalos/policy/actions.py, or
        # if policy would let any call it makes run without approval (a rule
        # or permission class removed, a tool left unclassified).
        run: pytest tests/contracts/test_action_policy_coverage.py -v
      - name: Adversarial tests
        # The security boundary: prompt injection, approval tampering, path
        # traversal, permission escalation and hostile tool payloads. Its own
        # step so a failure here is named as what it is.
        run: pytest tests/adversarial -v
      - name: Recovery scenarios and duplicate side-effect rate
        run: pytest tests/graph_scenarios/test_recovery_scenarios.py -v
      - name: Quality metrics gate
        # The golden set on the `rules` config. Fails on a baseline
        # regression, an unsafe adversarial case, or a critical bound in
        # evals/thresholds.json: approval recall below 100% (external writes
        # included) or any duplicated side effect.
        run: python -m evals.harness
      - name: Per-domain floors
        # The same run's quality section, recomputed from its results file
        # against evals/thresholds.json: fails when routing accuracy in any
        # domain, approval recall in any domain, or the forbidden-route count
        # breaks its floor. Its own step so the failure names what it is.
        run: python -m evals.harness quality evals/model_benchmarks/results/rules/results.json
      - name: Quality report
        if: always()
        run: |
          if [ -f evals/model_benchmarks/results/rules/summary.md ]; then
            cat evals/model_benchmarks/results/rules/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Unit tests
        run: pytest tests -v
      - name: Lint
        run: ruff check personalos apps mcp_servers tests scripts
      - name: UI API schema is current
        # ui/openapi.json is what the UI's typed client is generated from; a
        # route or model change has to regenerate it (and the `ui` job checks
        # the types generated from it).
        run: python scripts/export_openapi.py --check

  containers:
    # The images build, carry no secrets, fakes or dev dependencies, run as
    # non-root, and the compose stack comes up healthy on its defaults and
    # completes the quick start's workflow (docs/CONTAINERS.md).
    name: Container images and compose smoke test
    runs-on: ubuntu-latest
    needs: boundaries
    env:
      COMPOSE: docker compose -f docker-compose.yml -f compose.quickstart.yml --profile ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the smoke test's client
        run: pip install "httpx>=0.25"
      - name: Build the images
        # Twice: the quick start override replaces the worker's image with
        # `worker-quickstart`, so the production `worker` image only comes
        # from the base file. The shared stages are cached, so the second
        # build is quick.
        run: |
          docker compose --profile ui build
          $COMPOSE build
      - name: Image checks (non-root, no fakes, no dev dependencies)
        run: |
          for image in personalos-api:local personalos-worker:local; do
            echo "== $image"
            test "$(docker image inspect -f '{{.Config.User}}' "$image")" = "10001:10001"
            docker run --rm -i --network none --entrypoint python "$image" - < scripts/check_image.py
          done
          test "$(docker image inspect -f '{{.Config.User}}' personalos-ui:local)" = "101"
      - name: Secret scan of the images
        # What a secret could be baked into: the files the build copied in
        # (/app, /var/lib/personalos) and the image config and layer history
        # (ENV, ARG, LABEL, every RUN). Third-party packages under /opt/venv
        # are not ours and are left to dependency scanning.
        run: |
          mkdir -p image-scan
          for image in personalos-api:local personalos-worker:local personalos-worker-quickstart:local; do
            dir="image-scan/${image%%:*}"
            mkdir -p "$dir"
            cid=$(docker create "$image")
            docker export "$cid" | tar -x -C "$dir" app var/lib/personalos
            docker rm "$cid" > /dev/null
            docker image inspect "$image" > "$dir/image-config.json"
            docker history --no-trunc "$image" > "$dir/image-history.txt"
          done
          cid=$(docker create personalos-ui:local)
          mkdir -p image-scan/personalos-ui
          docker export "$cid" | tar -x -C image-scan/personalos-ui usr/share/nginx/html etc/nginx
          docker rm "$cid" > /dev/null
          docker image inspect personalos-ui:local > image-scan/personalos-ui/image-config.json
          docker history --no-trunc personalos-ui:local > image-scan/personalos-ui/image-history.txt
          docker run --rm -v "$PWD/image-scan:/scan:ro" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            dir /scan --no-banner --redact --exit-code 1
      - name: Compose smoke test
        # Stack up, health checks pass, Postgres unreachable from the host,
        # API on loopback only, the quick start's workflow queued and
        # approved, stack torn down.
        run: python scripts/smoke_compose.py --no-build

  ui:
    name: UI
    runs-on: ubuntu-latest
    needs: boundaries
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types match ui/openapi.json
        run: npx openapi-typescript openapi.json --check --output src/api/schema.d.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Build
        run: npm run build
