name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  boundaries:
    # Runs first and without installing anything: the check parses source with
    # ast, so a bad dependency fails in seconds instead of after a full install.
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check layer boundaries
        run: python scripts/check_boundaries.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: boundaries
    services:
      postgres:
        # pgvector/pgvector ships the `vector` extension the pgvector
        # migration (202609150001) needs, which the stock postgres image
        # doesn't have.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: personalos
          POSTGRES_PASSWORD: personalos
          POSTGRES_DB: personalos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personalos:personalos@localhost:5432/personalos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Boundary tests
        run: pytest tests/architecture -v
      - name: Unit tests
        run: pytest tests -v
      - name: Lint
        run: ruff check personalos apps mcp_servers tests scripts
