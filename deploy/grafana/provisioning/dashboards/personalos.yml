# Loads the dashboards in deploy/grafana/dashboards/ (generated by
# scripts/build_dashboards.py) into a "PersonalOS" folder. They are code:
# edits made in the Grafana UI are refused, so a change goes through the
# generator and review like any other.
apiVersion: 1

providers:
  - name: personalos
    folder: PersonalOS
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
