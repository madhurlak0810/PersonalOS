# Prometheus for the compose stack's `monitoring` profile (docker-compose.yml).
#
# Scrapes the OpenTelemetry collector, which turns the API's and the worker's
# OTLP metrics into a Prometheus target, evaluates the alert rules in
# rules/, and sends firing alerts to Alertmanager. Internal network only: no
# host port. Query it through Grafana (http://127.0.0.1:3000), whose
# provisioned datasource points here.
#
# The rules are unit-tested with promtool (tests/), in CI:
#   promtool test rules deploy/prometheus/tests/*.test.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: personalos
    # `job` and `instance` on each series come from the collector: the
    # process's `service.name` (personalos-api, personalos-worker).
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
