# OpenTelemetry collector for the compose stack (docker-compose.yml).
#
# Receives OTLP from the API and the worker on the internal network only (no
# host port), and prints a one-line summary per batch to the collector's log
# (`docker compose logs otel-collector`). To ship traces somewhere, add an
# exporter here -- an `otlphttp` to Jaeger, Tempo or a vendor -- and list it in
# the pipeline. Spans are already redacted by the app before they leave it.
#
# Metrics are exposed for Prometheus to scrape on :8889 (internal only; the
# `monitoring` profile's Prometheus scrapes it). The series names are the
# ones `personalos.observability.metrics` derives and docs/METRICS.md lists:
# dots become underscores, seconds append `_seconds`, counters `_total`.

extensions:
  # GET :13133/ answers 200 once the pipelines are running. The collector
  # image has no shell, so compose cannot probe this itself; the CI smoke test
  # probes it from the API container.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  batch: {}

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
    # Pinned rather than left to the default, because every dashboard and
    # alert rule depends on the exact names this produces.
    translation_strategy: UnderscoreEscapingWithSuffixes
    # A series not pushed for this long is dropped. The app pushes every 15s,
    # and a stalled workflow's gauge series stops being pushed once it moves
    # again, so this bounds how long a cleared stall keeps its alert firing.
    metric_expiration: 1m
    resource_to_telemetry_conversion:
      enabled: false

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info
